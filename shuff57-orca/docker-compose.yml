services:
  app_proxy:
    environment:
      APP_HOST: shuff57-orca_web_1
      APP_PORT: 3000

  web:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    restart: on-failure
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/install-orca.sh:/custom-cont-init.d/install-orca.sh:ro
